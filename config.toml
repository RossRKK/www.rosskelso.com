base_url = "https://www.rosskelso.com"
title = "Ross Kelso"
description = "Notes and things I collect as I tinker."
default_language = "en"

compile_sass = true
minify_html = true
build_search_index = true
generate_feeds = true

taxonomies = [{ name = "tags" }]

theme = "apollo"

[extra]
theme = "toggle"          # light/dark toggle
toc = true
fancy_code = true
dynamic_note = true

menu = [
  { name = "Guides", url = "/guides", weight = 1 },
  { name = "Cheat Sheets", url = "/cheat-sheets", weight = 2 },
  { name = "Blog", url = "/blog", weight = 3 },
  { name = "Downloads", url = "/downloads", weight = 4 },
  { name = "CV", url = "/cv", weight = 5 },
]

socials = [
  { name = "github", url = "https://github.com/RossRKK", icon = "github" },
]
