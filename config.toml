base_url = "https://www.rosskelso.com"
title = "Ross Kelso"
description = "Notes and things I collect as I tinker."
default_language = "en"

compile_sass = true
minify_html = true
build_search_index = true
generate_feeds = true

taxonomies = [{ name = "tags" }]

theme = "apollo"

[extra]
theme = "toggle"          # light/dark toggle
toc = true
fancy_code = true
dynamic_note = true
favicon = "favicon.ico"
stylesheets = ["custom.css"]   # 0xProto font override; loads after the theme css

menu = [
  { name = "Blog", url = "/blog", weight = 1 },
  { name = "Tags", url = "/tags", weight = 2 },
  { name = "Downloads", url = "/downloads", weight = 3 },
  { name = "CV", url = "/cv", weight = 4 },
]

socials = [
  { name = "github", url = "https://github.com/RossRKK", icon = "github" },
]
